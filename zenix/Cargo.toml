[package]
name = "zenix"
version = "0.0.1"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zoburo/zenix"
homepage = "https://github.com/zoburo/zenix"
description = "High-performance and ergonomic Rust HTTP framework inspired by Go Fiber."

[dependencies]
bytes = "1.11.1"
http = "1.4.1"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["http1", "server", "tokio"] }
garde = { version = "0.19", features = ["derive", "email"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["net", "rt"] }
zenix-derive = { path = "../zenix-derive" }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }
